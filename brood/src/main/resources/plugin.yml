name: Brood
version: '${version}'
main: net.baffoon.brood.Brood
api-version: '26.3'
description: Wear the Brood Skin, shrink to a parasite, and crawl inside animals.
authors: [BaffoonMC]
commands:
  brood:
    description: The Brood (test). /brood give [player], /brood shed, /brood leave
    usage: /brood <give [player]|shed|leave|reload>
permissions:
  brood.admin:
    description: Can give out Brood Skins.
    default: op
