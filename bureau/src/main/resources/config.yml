# The Bureau of Cold-Blooded Affairs. Prices are in server money (Essentials); Cold Hard Cash is the lizards' banknote.

exchange:
  start-price: 25.0       # the very first price
  base-price: 25.0        # where the price drifts back to
  min-price: 10.0
  max-price: 60.0
  spread: 0.05            # players buy 5% above the price and sell 5% below it (the lizards' cut)
  daily-limit: 0.20       # the price never moves more than 20% from where the day opened
  drift: 0.02             # the random wobble every half hour
  pull: 0.10              # how hard it's pulled back towards base-price each half hour
  pressure: 0.0005        # each note bought nudges the price up this much (selling nudges it down)
  rally: 0.30             # an event rally pushes the price up 30% over ten minutes...
  crash: 0.20             # ...and a crash down 20%
  buy-limit-per-day: 64   # most Cash one player can buy in a day
  moloch-events: true     # Moloch waking starts a rally; Moloch going quiet starts a crash (needs PlaceholderAPI + Soulbound)
  anywhere: false         # true lets players open the Exchange with /bureau exchange anywhere, not just at the teller
  timezone: Europe/London # when a new trading day starts

vault:
  withdraw-fee: 0.02      # taking Cash out of the vault costs 2% (at least 1)

# Tax on Exchange profits. Sell Cash for more than you paid for it and the Bureau wants a cut of the profit.
tax:
  profit-rate: 0.10       # 10% of the profit
  ledger-rate: 0.07       # ...or 7% while carrying an Accountant's Ledger
  notice-hours: 72        # time to pay before interest is added (the Final Notice)
  final-hours: 48         # time after the Final Notice before the Taxman is assigned
  interest: 0.25          # added at the Final Notice
  min-debt: 25            # the Taxman doesn't bother with less than this
  min-hours-played: 5     # ...or with players newer than this

# The Taxman: hunts players whose case is "assigned", when they're out in the wild.
taxman:
  speed: 0.23             # walking pace (a player walks a little faster; sprinting gets away)
  hunt-minutes: 20        # he gives up after this long...
  cooldown-hours: 20      # ...and comes back after this long
  spawn-radius: 96        # never within this far of a world's spawn
  bureau-radius: 48       # never within this far of the Bureau's lift
  wait-minutes: 5         # if you stand somewhere safe, he waits this long, then leaves
  cold-speed: 0.35        # in cold biomes or on snow and ice he slows to this fraction...
  cold-seconds: 60        # ...and gives up after this much cold
  stagger-seconds: 3      # hitting him only stops him for this long
  resist-fee: 0.05        # ...and adds 5% to the bill
  impound-stacks: 3       # if money and Cash don't cover it, up to this many backpack stacks are impounded (returned on paying)

# Bureau Security.
security:
  bodyguard-price: 8      # Cold Hard Cash, hired from a Security lizard (right-click)
  bodyguard-minutes: 60
  speed: 0.3
  hold-seconds: 10        # a bodyguard holds the Taxman back this long...
  hold-cooldown-seconds: 25   # ...this often
  swat-damage: 4          # a bodyguard's punch on mobs coming for you
  fired-hours: 24         # /bureau fire: can't ride the lift down for this long
  peace-radius: 16        # no player-on-player fighting this close to a Security lizard (0 = off)

# Bureau items (see /bureau item). Their prices are in the shop list below.
items:
  suit-pay-bonus: 0.10        # wearing the full Bureau suit: +10% contract pay...
  suit-spread-off: 0.01       # ...and the Exchange takes 1% less
  settle-minutes: 60          # Settlement Papers take this much off Moloch's Curse...
  settle-cooldown-hours: 20   # ...once a day
  audit-chance: 0.25          # three settlements in a week: this chance of an audit...
  audit-fine: 50              # ...for this much (in money, added to their tax bill)
  life-insurance-days: 3      # one Life Insurance policy per this many days
  lift-pass-hours: 20         # how often a Lift Pass works
  report-accuracy: 0.7        # how often a Market Report is right
  expense-spread: 0.03        # the Exchange cut with an Expense Account
  party-minutes: 5
  party-cooldown-minutes: 60
  party-xp: 150               # XP points (not levels) for everyone at the party when it ends

# The lizard shop, the right-hand side of the Exchange, nine to a page (the book at the bottom turns pages).
# "MATERIAL amount price" or "bureau:<item> amount price"; prices are in Cold Hard Cash.
shop:
  - "bureau:settlement_papers 1 20"
  - "bureau:life_insurance 1 40"
  - "bureau:pet_insurance 1 15"
  - "bureau:strongbox 1 25"
  - "bureau:tax_receipt 1 12"
  - "bureau:briefcase 1 30"
  - "bureau:lift_pass 1 20"
  - "bureau:market_report 1 5"
  - "bureau:expense_card 1 35"
  - "bureau:accountants_ledger 1 20"
  - "bureau:sunglasses 1 10"
  - "bureau:pink_slip 1 4"
  - "bureau:desk_lizard 1 60"
  - "bureau:fun_ticket 1 30"
  - "bureau:golden_stapler 1 100"
  - "bureau:suit_jacket 1 20"
  - "bureau:suit_trousers 1 15"
  - "bureau:suit_shoes 1 10"
  - "NAME_TAG 1 6"
  - "SADDLE 1 10"
  - "SPYGLASS 1 8"
  - "EXPERIENCE_BOTTLE 8 12"
  - "GOLDEN_CARROT 16 4"
  - "LEAD 2 3"
  - "BUNDLE 1 10"
  - "TURTLE_SCUTE 2 18"
  - "CLOCK 1 5"

# Contracts: daily jobs from Mrs. Sssmith (the receptionist) or /contracts.
contracts:
  per-day: 3
  manager-per-day: 4          # from the third rank up
  strikes-to-fire: 3          # signed contracts left unfinished at the end of the day, in a week
  pay-bonus-per-rank: 0.10    # +10% pay for each rank above Intern
  company-bonus: 0.10         # +10% when the pay goes to your company's vault
  ranks: ["Intern 0", "Clerk 15", "Manager 60", "Regional Lizard 150", "Director 400"]
  # "kind target amount reward": kind is deliver, kill, mine or fish; reward is Cold Hard Cash.
  # mine targets also count their deepslate versions (IRON_ORE covers DEEPSLATE_IRON_ORE); fish takes ANY.
  jobs:
    - "deliver WHEAT 64 3"
    - "deliver CARROT 64 3"
    - "deliver POTATO 64 3"
    - "deliver OAK_LOG 32 3"
    - "deliver SPRUCE_LOG 32 3"
    - "deliver COBBLESTONE 128 2"
    - "deliver IRON_INGOT 16 5"
    - "deliver COAL 32 3"
    - "deliver PAPER 32 3"
    - "deliver LEATHER 16 4"
    - "deliver GLASS 32 3"
    - "deliver SUGAR_CANE 32 2"
    - "deliver BONE 24 3"
    - "deliver STRING 16 3"
    - "deliver PUMPKIN 16 3"
    - "kill ZOMBIE 15 3"
    - "kill SKELETON 12 3"
    - "kill SPIDER 10 3"
    - "kill CREEPER 6 4"
    - "kill DROWNED 8 4"
    - "kill ENDERMAN 4 5"
    - "kill WITCH 2 5"
    - "mine STONE 256 2"
    - "mine DEEPSLATE 128 3"
    - "mine COAL_ORE 16 3"
    - "mine IRON_ORE 12 4"
    - "mine COPPER_ORE 20 2"
    - "mine REDSTONE_ORE 10 3"
    - "fish ANY 10 3"

# Companies: a team with a shared vault.
companies:
  create-price: 100           # Cold Hard Cash to found one
  max-members: 5
  weekly-bonus: 10            # Cold Hard Cash for the Company of the Week

# What the lizards say when clicked.
# Stock tickers: /bureau ticker place [width] while looking at a wall, /bureau ticker remove.
ticker:
  scale: 2.0        # text size: 2.0 is half a block tall
  speed: 1.6        # blocks a second, right to left
  gap: 1.2          # blocks between one quote and the next
  stocks:           # made-up lizard stocks; their prices wander on their own and follow rallies and crashes
    - SSTR
    - WARMROCK
    - COLDWELL
    - BASK
    - SCALE
    - MOLT
    - TAILCO
    - SWAMP
    - FLYCORP
    - HISS
    - VENOM
    - GECK

# Candlestick charts of the Cold Hard Cash price: /bureau chart place [width] [height], /bureau chart remove.
chart:
  candle-minutes: 30   # how long each candle covers
  candle-width: 0.5    # blocks per candle

# What the lizards say. A line starting with ! is SHOUTED (bold red, with a hiss).
# Context: "owes" when you owe tax, "director-crash"/"director-rally" during market events,
# "rage" when you keep pestering one lizard, "fired" for the Director losing it.
dialogue:
  teller:
    - "Next! NEXT! Are you buying or are you breathing on my glass?"
    - "Prices are final. Your feelings are NOT my department."
    - "Buy low. Sell high. Do NOT cry at my counter."
    - "!COUNT IT TWICE. WE DON'T DO REFUNDS. WE DON'T DO SMILES."
  receptionist:
    - "Take a number. We have no numbers. TAKE ONE ANYWAY."
    - "Do you have an appointment? No? Then SIT. DOWN."
    - "The Director is in a meeting. He is ALWAYS in a meeting. Stop asking."
    - "!SIGN THE FORM. INITIAL THE FORM. DO NOT LICK THE FORM."
  director:
    - "Cold-blooded. Nothing personal."
    - "Time is money. You are wasting BOTH."
    - "You're standing in my office like you OWN it. You own NOTHING."
    - "!PROFITS! I WANT TO SEE PROFITS! WHY AM I LOOKING AT YOU?"
  director-crash:
    - "!WHO SOLD?! WHO PANICKED?! SOMEBODY IN THIS BUILDING IS GETTING FIRED!"
    - "!THE MARKET IS ON FIRE AND YOU WANT TO CHAT?!"
  director-rally:
    - "Business is BOOMING. Don't touch anything."
    - "Sssplendid quarter. Get back to work before I change my mind."
  security:
    - "Keep. Moving."
    - "No basking in the corridors. I WILL escort you."
    - "I've been told to throw someone out today. Might be you."
    - "!HANDS WHERE I CAN SEE THEM. ALL FOUR OF THEM."
  clerk:
    - "Form 27-B/6? Two floors down. There ARE no floors down. Figure it out."
    - "I'm on my coffee break. Come back when I care. So, never."
    - "Don't tell the Director the photocopier is warm. I sit on it. WHAT ARE YOU LOOKING AT?"
  votes:
    - "Vote early. Vote often. The lizards are COUNTING."
    - "You haven't voted today? Then what ARE you doing with your life?"
    - "!EVERY VOTE IS A POINT. EVERY POINT IS PAPERWORK. GO. VOTE."
  taxman:
    - "I have all day. And ALL night."
    - "Sssettle up. Or I come to YOU."
    - "!EVERYONE PAYS. EVENTUALLY. YOU'RE NO DIFFERENT."
  owes:
    - "You OWE us. Did you think we forgot? We NEVER forget."
    - "!PAY YOUR TAXES, YOU WARM-BLOODED FREELOADER!"
    - "Your file is on my desk. It's THICK. Type /tax pay."
  rage:
    - "!WHAT. DO. YOU. WANT."
    - "!STOP CLICKING ME. I AM A PROFESSIONAL."
    - "!ONE MORE TIME AND I'M CALLING SECURITY."
  fired:
    - "!YOU'RE FIRED! GET OUT OF MY OFFICE!"
    - "!YOU'RE FIRED! TAKE YOUR STAPLER AND GO!"
    - "!YOU'RE FIRED! AND DON'T LET THE LIFT DOORS HIT YOU!"
