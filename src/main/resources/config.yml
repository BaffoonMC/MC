# Hit someone and their hearts show above your hotbar (name, a row of hearts, and e.g. 7.5/10).
hit-health:
  enabled: true
  mobs: false      # true = monsters and animals too, not just players (Moloch and his servants keep the boss bar)

# Vote ranks: every vote counts towards your level, and you're moved up the LuckPerms track (settrack, so bought ranks
# and staff ranks on other tracks are left alone) the moment you reach the number. Nobody is ever moved down.
# Lifetime votes are separate from points, so spending points never costs you a level. /voteshop votes <player> to check or fix.
vote-ranks:
  enabled: true
  track: ranks
  announce: true          # tell everyone online when someone ranks up
  levels-url: "https://store.playbaffoonmc.net/wiki.html#levels"
  # group votes (Newcomer is the default group, so it isn't listed)
  ladder: ["beginner 5", "novice 35", "intermediate 100", "advanced 175", "adept 275", "expert 400", "seasoned 550",
           "veteran 750", "elder 1150", "ancient 2000"]
  broadcast: true         # "minecraftmurdere voted for the server on Minecraft-MP!" in chat for every vote
  cooldown-hours: 24      # /vote shows a site red (done) for this long after you vote on it, then green again
  # The voting sites /vote lists, as "Name|link". Each needs NuVotifier set up on its listing to count.
  sites:
    - "Minecraft-MP|https://minecraft-mp.com/server/366545/vote/"
    - "MinecraftServers.org|https://minecraftservers.org/vote/695841"
    - "Minecraft-Server-List|https://minecraft-server-list.com/server/524784/vote/"
    - "TopG|https://topg.org/minecraft-servers/server-688102"
    - "Play-Minecraft-Servers|https://play-minecraft-servers.com/minecraft-servers/baffoonmc/?tab=vote"
    - "Best-Minecraft-Servers|https://best-minecraft-servers.co/server-baffoonmc.33610/vote"
# /sb player <name> reset: wipes someone back to brand new (inventory, ender chest, XP, advancements, stats and everything
# Soulbound keeps on them). These console commands also run, for the other plugins ({player} = their name, {uuid} = their id).
account-reset:
  keep-wardrobe: false     # true = they keep the hats in their wardrobe (e.g. ones bought with real money)
  essentials: true         # wipe their Essentials data too: homes, money, nickname, mail
  commands:
    - "deleteallclaims {player}"            # GriefPrevention: their claims
    - "setaccruedclaimblocks {player} 0"     # GriefPrevention: back to the starting claim blocks
    # - "lp user {player} parent set default"  # LuckPerms: back to Newcomer (this also takes away bought ranks!)
# The Sleeper (/sb world sleeper): a homeless man asleep at spawn. Poke him and he gets grumpier; the 4th time he gets up
# and shoves you away (no damage), then lies back down.
# Jotun's Crown (the Jotun's prize): wearing it makes you this many times your size, and full blocks you place go down
# 2x2 (one high), using a block from your hand for each. Sneak to place one. Crowns update themselves to a new scale.
jotun-crown:
  scale: 2.0
  jump-bonus: 0.2    # extra jump strength per extra size (0.2 at 2x = twice as high, like Jump Boost II); steps and safe falls scale too
  block-reach-bonus: 4.5   # extra reach for placing and breaking blocks per extra size (4.5 at 2x = twice as far); hitting stays normal
  build-2x2: true

# Jotun, the Giant Creaking (/sb world creaking [size|remove]): it turns to watch the nearest player it can see and charges a
# guardian's beam from its eyes. Hold its gaze for charge-seconds and the beam hits for beam-damage (10000 = dead, though
# a Totem of Undying still saves you). Break its line of sight and the beam fizzles. Fire and lava can't hurt it.
giant-creaking:
  name: Jotun
  size: 16               # 16 is about 46 blocks tall: summon it somewhere open
  health: 300
  sight: 64              # how far it can see you, in blocks
  charge-seconds: 3
  cooldown-seconds: 3    # rest between beams
  beam-damage: 10000
  melee-damage: 12
  xp-each: 600          # given straight to everyone who hurt it (600 is about level 20 from nothing)
  xp-burst: 100         # orbs that spill out where it falls
  # Wild Jotuns walk the last stretch of Moloch's realm, just before The Wall (from/to = blocks from the temple; The Wall
  # starts at about 6,830). Every check-seconds, each player out there has this chance of one rising about distance
  # blocks away, unless one is already near them or max are about. Wild ones vanish when nobody's near.
  wild:
    enabled: true
    from: 6300
    to: 6800
    check-seconds: 30
    chance: 0.15
    distance: 90
    max: 3
sleeper:
  skin: ""                     # empty = his own skin from the resource pack; or a player name to wear their skin instead
  forget-seconds: 30           # he forgets how much you've annoyed him after this long
  shove-cooldown-seconds: 120  # he only gets up for the same person this often
  shove-strength: 1.6
  body-direction: 1            # his speech and click box sit over his middle; set -1 if they ever land past his feet instead
# /rtp (also /wild): sends you to the same random overworld spots as the Wild Drop (range is under wild-drop below).
rtp:
  enabled: true
  cooldown-minutes: 10
  warmup-seconds: 3     # stand still this long first (moving or getting hurt cancels it)
  combat-seconds: 30    # not within this long of hitting or being hit by a player
# Announcements: one random line to everyone every few hours (store and voting). MiniMessage format: <gold>, <yellow>,
# <click:run_command:'/vote'>...</click>, <click:open_url:'https://...'>...</click>. Test one with /sb world broadcast.
# The Market (/market): players buy from and sell to each other. The Market holds what's listed (and the money for
# wanted requests), so nobody can be scammed. Uses Essentials money. Listings and money live in market.yml.
market:
  enabled: true
  fee-percent: 2        # taken from each sale (keeps prices from inflating)
  listing-days: 7       # unsold things and unfilled requests go back after this long
  max-listings: 10      # per player
  max-wanted: 5         # wanted requests per player
  confirm-at: 1000      # buying something this expensive needs a second click
# The Server Shop (/shop) is stocked in game: /shop add, /shop edit. Its items live in servershop.yml.
broadcasts:
  enabled: true
  every-minutes: 180
  min-players: 1
  prefix: "<gold><bold>BaffoonMC</bold></gold> <dark_gray>></dark_gray> "
  lines:
    - "<gray>Vote for us with <click:run_command:'/vote'><hover:show_text:'<gray>Click to vote'><yellow>/vote</yellow></hover></click> and climb the ranks, from Newcomer all the way to Ancient."
    - "<gray>Every vote is a point for the <click:run_command:'/voteshop'><hover:show_text:'<gray>Click to open the Vote Shop'><yellow>/voteshop</yellow></hover></click>. Diamonds, netherite, spawn eggs and more."
    - "<gray>You can vote 5 times a day. That's 5 points, every day, for free. <click:run_command:'/vote'><hover:show_text:'<gray>Click to vote'><yellow>/vote</yellow></hover></click>"
    - "<gray>Votes keep the server alive. And Moloch fed. Probably. <click:run_command:'/vote'><hover:show_text:'<gray>Click to vote'><yellow>/vote</yellow></hover></click>"
    - "<gray>Love BaffoonMC? Help keep the lights on at <click:open_url:'https://store.playbaffoonmc.net'><hover:show_text:'<gray>Open the store'><yellow>store.playbaffoonmc.net</yellow></hover></click>."
    - "<gray>Supporter, Patron and Chosen ranks come with tags, hats and claim flight. <click:open_url:'https://store.playbaffoonmc.net'><hover:show_text:'<gray>Open the store'><yellow>store.playbaffoonmc.net</yellow></hover></click>"
    - "<gray>Fancy a new look? Hats are waiting in the <click:run_command:'/wardrobe'><yellow>/wardrobe</yellow></click>. Tokens at <click:open_url:'https://store.playbaffoonmc.net'><hover:show_text:'<gray>Open the store'><yellow>store.playbaffoonmc.net</yellow></hover></click>."
    - "<gray>Nothing in the store helps you in a fight. Just style, comfort and bragging rights. <click:open_url:'https://store.playbaffoonmc.net'><hover:show_text:'<gray>Open the store'><yellow>store.playbaffoonmc.net</yellow></hover></click>"
wild-drop:
  world: ""          # empty = the main overworld ("world")
  center-x: 0
  center-z: 0
  min-range: 500     # never closer than this to the centre (keeps people off spawn, the temple and God's island)
  max-range: 5000
  command: ""        # set e.g. "tpr" to use a command instead of the built-in drop

# ---------------------------------------------------------------- dying
# What you keep when you die (this replaces the keepInventory game rule, so it doesn't matter what that's set to).
# Killed by the world (mobs, falls, lava, Moloch, God...): you keep everything, levels too.
# Killed by another player: pvp-drops decides. "backpack" = the 27 slots above your hotbar drop (armour, hotbar and
# off hand stay); "all" = everything drops; "none" = nothing does. Moloch's Curse still drops everything regardless.
death:
  enabled: true
  pvp-drops: all

# ---------------------------------------------------------------- combat logging
# Hitting a player or being hit by one puts you both in combat for `seconds`. Logging out while in combat kills you
# and everything drops (as if the other player had killed you). Restarts and kicks don't count. These commands don't
# work while in combat (anything not listed still does). Staff can skip it all with soulbound.combatlog.bypass.
combat-log:
  enabled: true
  seconds: 15
  punish-timeouts: true   # "timed out" counts too (pulling the plug looks the same as a real drop-out)
  blocked-commands: [spawn, home, homes, back, warp, warps, tpa, tpahere, tpaccept, tpyes, call, tpask, rtp, wild,
    randomtp, tpr, ec, echest, enderchest, fly, god, creative, hub, lobby, market, ah, auction, marketplace, shop,
    servershop, sellshop, voteshop, trash, disposal]

# ---------------------------------------------------------------- no-PvP places
# No player-vs-player damage in Moloch's temple (moloch.temple-radius around the pyramid) or on God's main island
# (island.radius), or inside anyone's land claim. Anyone dragging a captive can still be hit there, so a sacrifice can
# always be stopped.
pvp-off:
  temple: true
  gods-island: true
  claims: true

# Tumour Pie (double stuffed): 2 tumours + nether wart + egg + sugar. A pumpkin pie's worth of food. Inhumans: just food
# (with their raw-flesh bonus). The living: fine at first, then after delay-seconds "Something doesn't feel right", and
# they swell to 1.5x size for growth-seconds and are poisoned for poison-seconds.
tumour-pie:
  hunger: 8
  saturation: 9.6
  delay-seconds: 30
  growth-seconds: 120
  poison-seconds: 20

# Cloud Candy: 2 Cloud Cotton + sugar + a stick. Cotton only grows in Heaven, so it feeds you well (steak is 8 / 12.8),
# then you float (Slow Falling) and any Tumour Pie swelling and poison are gone. Inhumans can't eat it.
cloud-candy:
  hunger: 10
  saturation: 16.0
  float-seconds: 30

# The Rapture Crossbow: sold by the Peacekeeper (peacekeeper.price.rapture-tears Tears of God + rapture-cotton Cloud
# Cotton; 3 and 32 by default). Only the Graced can load it. Loads in a blink (load-ticks), faster and harder-hitting bolts, and
# whatever a bolt hits floats up for a moment (undead longer; inhumans glow). Nobody's lifted twice within the cooldown.
rapture-crossbow:
  # How long loading takes, in ticks (20 = 1 second). A normal crossbow takes 25, Quick Charge III 10.
  load-ticks: 8      # 20 ticks = 1 s; 8 = 0.4 s (Quick Charge III is 10)
  speed-multiplier: 1.3
  damage-multiplier: 1.5
  levitation-seconds: 1
  undead-levitation-seconds: 2
  inhuman-glow-seconds: 5
  relift-cooldown-seconds: 3

# The Forsaken (config section still named deeper-still): push your own homunculus into the summit fire. Moloch's hunger goes to 100% (he wakes in a few minutes),
# and you're marked for good: Speed at night in the Overworld, extra health in Moloch's realm, and the Zombie Bell.
# The Angel Engine won't take you any more, you can never raise another homunculus, and it still talks to you for a while.
deeper-still:
  night-speed-level: 2
  realm-extra-health: 4
  bell-zombies: 4                # the bell only rings for the inhuman (they've eaten the Heart of Darkness)
  bell-zombie-seconds: 120
  bell-zombie-scale: 1.15
  bell-zombie-speed: 1.3         # times a normal zombie's speed
  bell-zombie-damage: 5          # base hit (a normal zombie is 3), plus their iron axe
  bell-zombie-health: 30
  bell-bite-hunger-seconds: 10
  bell-cooldown-seconds: 300
  haunt-days: 3
