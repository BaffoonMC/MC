name: Soulbound
version: '${version}'
main: net.soulbound.Soulbound
api-version: '26.3'
description: Capture, sacrifice and Moloch himself.
authors: [BaffoonMC]
softdepend: [PlaceholderAPI, GriefPrevention, Votifier, NuVotifier]
commands:
  soulbound:
    description: Soulbound admin controls (/sb help), and /sb release to let your captive go.
    usage: /sb <give|items|player|moloch|god|world|reload|release|help>
    aliases: [sb]
  moloch:
    description: Moloch's state, and admin controls for his awakening.
    usage: /moloch [leave|awaken|stop|hunger|curse|uncurse|gate|setarrival|reload]
  bestiary:
    description: Open the Bestiary, the book of everyone and everything in BaffoonMC.
    usage: /bestiary
  wardrobe:
    description: Your Hat Wardrobe. Store hats, put them on, unlock new ones with Hat Tokens, and sell them to other players.
    usage: /wardrobe [sell <player> <price>|accept|decline|tokens]
    aliases: [hats]
  claimfly:
    description: Turn your claim flight off or back on (Patron perk).
    usage: /claimfly
  market:
    description: The Market. Buy from and sell to other players, safely.
    usage: /market [sell <price> [each]|want <amount> <price each>|search <what>|wanted|yours]
    aliases: [ah, auction, marketplace]
  shop:
    description: The Server Shop. Sell crops and drops to the server, buy basics.
    usage: /shop [page]
    aliases: [servershop, sellshop]
  store:
    description: A link to the BaffoonMC store.
    usage: /store
    aliases: [buy, donate]
  rtp:
    description: Get sent to a random safe spot in the overworld.
    usage: /rtp
    aliases: [wild, randomtp]
  voteshop:
    description: The Vote Shop. Spend the points you get for voting (admins - /voteshop help).
    usage: /voteshop [page|add <price> [page]|edit [page]|points <player> [add|take|set] <n>]
    aliases: [vshop]
  god:
    description: Answer God when he asks why you're here.
    usage: /god <challenge|lost|forgive|look>
permissions:
  soulbound.commands.seeall:
    description: See every command in the / suggestions, including staff tools hidden from players.
    default: op
  soulbound.combatlog.bypass:
    description: Logging out mid-fight doesn't kill you, and escape commands still work in combat.
    default: false
  soulbound.creative.bypass:
    description: Not locked down in the Creative world (keeps your own inventory, ender chest and commands there).
    default: op
  soulbound.capture:
    description: Can capture weakened players with a lead.
    default: true
  soulbound.immune:
    description: Can never be captured.
    default: op
  soulbound.admin:
    description: Can reload the config.
    default: op
  soulbound.bestiary.all:
    description: Every Bestiary page is open, met or not.
    default: op
  soulbound.island.build:
    description: Can build and break on God's main island in the End (everyone else can't).
    default: op
  soulbound.realm.build:
    description: Can build and break on the four roads of Moloch's realm (everyone else can't).
    default: op
  soulbound.claimfly:
    description: Can fly inside claims they own or are trusted to build in (the Patron perk).
    default: false
  soulbound.fly.bypass:
    description: Flight is never switched off for fights or in the no-fly zones.
    default: op
