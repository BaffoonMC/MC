# Rank perks that aren't unlocked yet: instead of "You do not have access to that command", players are told which
# rank unlocks it (and how many votes away it is), and which store rank has it too. Command: permission, rank, donor.
locked-commands:
  back: {permission: essentials.back, rank: beginner}
  workbench: {permission: essentials.workbench, rank: novice, donor: Patron}
  craft: {permission: essentials.workbench, rank: novice, donor: Patron}
  wb: {permission: essentials.workbench, rank: novice, donor: Patron}
  disposal: {permission: essentials.disposal, rank: intermediate}
  trash: {permission: essentials.disposal, rank: intermediate}
