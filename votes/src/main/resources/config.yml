# BaffoonVotes: /vote, vote ranks and the Vote Shop. NuVotifier sends the votes; Essentials pays the money.

# The Vote Shop (/voteshop). Stock it in game: hold something, /voteshop add <price> [page]; /voteshop edit to change it.
# Points come from votes through NuVotifier; the items and everyone's points are kept in voteshop.yml.
voteshop:
  points-per-vote: 1
  money-per-vote: 100            # Essentials money for each vote too (0 = none)
  confirm-at: 100                 # things costing this much or more need a second click to buy
  block-eggs-on-spawners: true    # spawn eggs can't change what a mob spawner spawns (admins still can)
  # Two more ready-made pages, for things worth saving up for: /voteshop stock extra adds them after the last page.
