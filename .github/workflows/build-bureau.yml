name: Build Bureau
on:
  push:
    paths: ['bureau/**', '.github/workflows/build-bureau.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bureau
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Bureau-jar
          path: bureau/build/libs/*.jar
      - name: Publish to the bureau-latest release (a plain download link, no GitHub login needed)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bureau-latest >/dev/null 2>&1 || gh release create bureau-latest --title "Bureau (latest)" --notes "Latest Bureau plugin jar." --latest=false
          gh release upload bureau-latest build/libs/*.jar --clobber
