name: Build Soulbound
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Soulbound-jar
          path: build/libs/*.jar
      - name: Publish to the soulbound-latest release (a plain download link, no GitHub login needed)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view soulbound-latest >/dev/null 2>&1 || gh release create soulbound-latest --title "Soulbound (latest)" --notes "Latest Soulbound plugin jar." --latest=false
          gh release upload soulbound-latest build/libs/*.jar --clobber
          new=$(basename build/libs/*.jar)
          for old in $(gh release view soulbound-latest --json assets -q '.assets[].name'); do [ "$old" != "$new" ] && gh release delete-asset soulbound-latest "$old" -y || true; done
