name: pack-check
on:
  push:
    branches: [pack-check]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon -q
      - name: Paper 26.3 with the plugin and the data packs
        run: |
          mkdir -p srv/plugins srv/world/datapacks && cp build/libs/*.jar srv/plugins/ && cp packs/*.zip srv/world/datapacks/
          URL=$(curl -sS -A "baffoonmc-ci" https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloads"]["server:default"]["url"])')
          curl -sS -L -A "baffoonmc-ci" -o srv/server.jar "$URL"
          echo eula=true > srv/eula.txt
          printf 'online-mode=false\nallow-nether=true\n' > srv/server.properties
      - run: cd srv && timeout 2400 python3 ../tools/packcheck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: |
            srv/full.log
            srv/report.json
