name: tebex-check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tebex-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: What the store's public API shows
        run: |
          T=1560v-3e98abbf684fe7d070513a6896f8e23dbe3ad840
          curl -sS "https://headless.tebex.io/api/accounts/$T" -o acct.json
          curl -sS "https://headless.tebex.io/api/accounts/$T/categories?includePackages=1" -o cats.json
          python3 - <<'PY'
          import json
          a = json.load(open('acct.json')).get('data', {})
          print("::notice title=store::name=%s currency=%s disabled=%s" % (a.get('name'), a.get('currency'), a.get('disabled')))
          c = json.load(open('cats.json')).get('data', [])
          lines = []
          for cat in c:
              lines.append("[%s] %s (parent=%s, %d packages)" % (cat.get('id'), cat.get('name'), (cat.get('parent') or {}).get('name') if isinstance(cat.get('parent'), dict) else cat.get('parent'), len(cat.get('packages') or [])))
              for p in cat.get('packages') or []:
                  lines.append("   - %s | %s %s | type=%s" % (p.get('name'), p.get('total_price'), p.get('currency'), p.get('type')))
          print("::notice title=categories::" + " %0A ".join(lines)[:3800])
          PY
      - name: Can a basket be made (what checkout would do)?
        run: |
          T=1560v-3e98abbf684fe7d070513a6896f8e23dbe3ad840
          R=$(curl -sS -X POST "https://headless.tebex.io/api/accounts/$T/baskets" -H 'Content-Type: application/json' \
            -d '{"username":"Notch","complete_url":"https://store.playbaffoonmc.net/","cancel_url":"https://store.playbaffoonmc.net/","complete_auto_redirect":true}')
          echo "$R" | head -c 600
          echo "::notice title=basket::$(echo "$R" | head -c 600 | tr '\n' ' ')"
          RAW=$(curl -sS "https://headless.tebex.io/api/accounts/$T" | head -c 900)
          echo "::notice title=account-raw::$RAW"
      - name: Add Supporter to that basket and see if Tebex gives a checkout link
        run: |
          T=1560v-3e98abbf684fe7d070513a6896f8e23dbe3ad840
          B=$(curl -sS -X POST "https://headless.tebex.io/api/accounts/$T/baskets" -H 'Content-Type: application/json' \
            -d '{"username":"Notch","complete_url":"https://store.playbaffoonmc.net/","cancel_url":"https://store.playbaffoonmc.net/","complete_auto_redirect":true}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["ident"])')
          PID=$(curl -sS "https://headless.tebex.io/api/accounts/$T/categories?includePackages=1" | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; print([p["id"] for c in d for p in c["packages"] if p["name"]=="Supporter"][0])')
          R=$(curl -sS -X POST "https://headless.tebex.io/api/baskets/$B/packages" -H 'Content-Type: application/json' -d "{\"package_id\": $PID, \"quantity\": 1}")
          echo "::notice title=add-package::$(echo "$R" | python3 -c 'import json,sys; d=json.load(sys.stdin); x=d.get("data",d); print({k: x.get(k) for k in ("total_price","currency","links","packages")} if isinstance(x,dict) else d)' 2>&1 | head -c 900)"
          A=$(curl -sS "https://headless.tebex.io/api/accounts/$T/baskets/$B/auth?returnUrl=https://store.playbaffoonmc.net/" | head -c 400)
          echo "::notice title=auth::$A"
      - name: Add a Custom Hat with the design form's answers, exactly as the store site sends them
        run: |
          T=1560v-3e98abbf684fe7d070513a6896f8e23dbe3ad840
          B=$(curl -sS -X POST "https://headless.tebex.io/api/accounts/$T/baskets" -H 'Content-Type: application/json' \
            -d '{"username":"Notch","complete_url":"https://store.playbaffoonmc.net/","cancel_url":"https://store.playbaffoonmc.net/","complete_auto_redirect":true}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["ident"])')
          CATS=$(curl -sS "https://headless.tebex.io/api/accounts/$T/categories?includePackages=1")
          for NAME in "Custom Hat" "Hat Token" "Supporter to Patron"; do
            PID=$(echo "$CATS" | NAME="$NAME" python3 -c 'import json,sys,os; d=json.load(sys.stdin)["data"]; print([p["id"] for c in d for p in c["packages"] if p["name"]==os.environ["NAME"]][0])')
            if [ "$NAME" = "Custom Hat" ]; then
              BODY="{\"package_id\": $PID, \"quantity\": 1, \"variable_data\": {\"hat_name\": \"Moon Moth Crown\", \"hat_description\": \"A pale moth sitting on my head, wings open, glowing a bit at night.\", \"hat_vibe\": \"cute, animated\", \"hat_colours\": \"#f4e9c8 #9fb7ff #2a2a3a\", \"hat_reference\": \"none\"}}"
            else
              BODY="{\"package_id\": $PID, \"quantity\": 1}"
            fi
            R=$(curl -sS -X POST "https://headless.tebex.io/api/baskets/$B/packages" -H 'Content-Type: application/json' -d "$BODY")
            echo "::notice title=add $NAME::$(echo "$R" | head -c 700 | tr '\n' ' ')"
          done
      - name: Which package descriptions are formatted as code blocks
        run: |
          T=1560v-3e98abbf684fe7d070513a6896f8e23dbe3ad840
          echo "::notice title=descriptions::$(curl -sS "https://headless.tebex.io/api/accounts/$T/categories?includePackages=1" | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; print(" | ".join(p["name"] + (" = CODE BLOCK" if "<pre" in (p.get("description") or "") or "<code" in (p.get("description") or "") else (" = empty" if not (p.get("description") or "").strip() else " = ok")) for c in d for p in c["packages"]))')"
      - name: Sidebar modules (goal, recent payments)
        run: |
          T=1560v-3e98abbf684fe7d070513a6896f8e23dbe3ad840
          echo "::notice title=sidebar::$(curl -sS "https://headless.tebex.io/api/accounts/$T/sidebar" | head -c 1500 | tr '\n' ' ')"

