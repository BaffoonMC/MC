name: Build WarriorTale
on:
  push:
    paths: ['warriortale/**', '.github/workflows/build-warriortale.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warriortale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee /tmp/build.log
      - name: Publish build log on failure
        if: failure()
        shell: bash
        working-directory: .
        run: |
          git config user.name "ci-log"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p ci-logs
          tail -n 400 /tmp/build.log > ci-logs/warriortale-build.log
          git add ci-logs
          git commit -m "ci: warriortale build log [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - uses: actions/upload-artifact@v4
        with:
          name: WarriorTale-jar
          path: warriortale/build/libs/*.jar
