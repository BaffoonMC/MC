name: Build WarriorTale
on:
  push:
    paths: ['warriortale/**', '.github/workflows/build-warriortale.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warriortale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe Mojang manifest
        shell: bash
        run: |
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26.3[^<]*</version>' | tail -5 | tee /tmp/probe.log
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -o '<latest>[^<]*</latest>' | tee -a /tmp/probe.log
          curl -sS https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o /tmp/vm.json
          python3 - << 'PY' | tee -a /tmp/probe.log
          import json
          d = json.load(open('/tmp/vm.json'))
          print('LATEST:', d['latest'])
          for v in d['versions'][:12]:
              print(v['id'], v['type'])
          import urllib.request
          for v in d['versions']:
              if v['id'] in ('26.3','26.3.1','26.3.2'):
                  j = json.load(urllib.request.urlopen(v['url']))
                  print(v['id'], 'downloads:', sorted(j['downloads'].keys()))
          PY
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee /tmp/build.log
      - name: API probe
        if: always()
        shell: bash
        run: |
          {
          echo "==== API PROBE ===="
          MJ=$(find /home/runner/.gradle /home/runner/work -name "*.jar" 2>/dev/null | grep -iE "minecraft.*(merged|client)" | grep -v sources | head -1)
          echo "MC JAR: $MJ"
          if [ -n "$MJ" ]; then
            unzip -l "$MJ" | grep -oE "net/minecraft/[A-Za-z/]*((ResourceLocation|Identifier|ValueInput|ValueOutput|SpawnReason|EntitySpawnReason)[A-Za-z]*)\.class" | sort -u | head -30
            CP="$MJ"
            echo "---- Level time methods ----"
            javap -cp "$CP" net.minecraft.world.level.Level 2>/dev/null | grep -iE "time|long " | head -12
            unzip -l "$MJ" | grep -oE "net/minecraft/[A-Za-z/]*(LevelData|TimeAccess|GameTime)[A-Za-z]*\.class" | head -8
            for C in net.minecraft.resources.Identifier net.minecraft.world.entity.AgeableMob net.minecraft.sounds.SoundEvent net.minecraft.client.renderer.entity.HumanoidMobRenderer net.minecraft.client.model.geom.builders.LayerDefinition net.minecraft.world.entity.Mob; do
              echo "---- $C ----"
              javap -cp "$CP" "$C" 2>/dev/null | grep -iE "of\(|fromNamespace|parse|create|interact|bakeRoot|getBreedOffspring|variableRange" | head -10
            done
            for C in net.minecraft.world.level.Level net.minecraft.world.entity.Entity net.minecraft.world.entity.EntityType net.minecraft.nbt.CompoundTag; do
              echo "---- $C ----"
              javap -cp "$CP" "$C" 2>/dev/null | grep -iE "night|clientside|client\(|create|moveTo|snapTo|setPos|getInt|getCompound" | head -12
            done
            for C in net.minecraft.client.renderer.entity.MobRenderer net.minecraft.client.renderer.entity.LivingEntityRenderer; do
              echo "---- $C ----"
              javap -cp "$CP" "$C" 2>/dev/null | grep -iE "texture|renderstate|extract" | head -8
            done
            VIO=$(unzip -l "$MJ" | grep -oE "net/minecraft/[A-Za-z/]*ValueOutput\.class" | head -1 | sed 's#/#.#g;s#\.class##')
            VIN=$(unzip -l "$MJ" | grep -oE "net/minecraft/[A-Za-z/]*ValueInput\.class" | head -1 | sed 's#/#.#g;s#\.class##')
            RL=$(unzip -l "$MJ" | grep -oE "net/minecraft/[A-Za-z/]*(ResourceLocation|Identifier)\.class" | head -3)
            echo "VIO=$VIO VIN=$VIN RL=$RL"
            for C in "$VIO" "$VIN"; do
              [ -n "$C" ] && echo "---- $C ----" && javap -cp "$CP" "$C" 2>/dev/null | head -25
            done
          fi
          echo "==== FABRIC API JARS ===="
          for J in $(find /home/runner/.gradle -name "fabric-rendering-v1*.jar" -o -name "fabric-object-builder*.jar" 2>/dev/null | grep -v sources | head 2>/dev/null); do
            echo "-- $J"
            unzip -l "$J" | grep -oE "net/fabricmc/fabric/api/[A-Za-z0-9/]*\.class" | grep -iE "EntityModelLayer|EntityRenderer|AttributeRegistry" | head -8
          done
          echo "==== END PROBE ===="
          } > /tmp/api.log 2>&1 || true
          cat /tmp/api.log
      - name: Publish build log on failure
        if: always()
        shell: bash
        working-directory: .
        run: |
          git config user.name "ci-log"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p ci-logs
          cat /tmp/api.log > ci-logs/warriortale-build.log 2>/dev/null || true
          cat /tmp/probe.log /tmp/build.log 2>/dev/null | tail -n 200 >> ci-logs/warriortale-build.log
          date >> ci-logs/warriortale-build.log
          git add ci-logs
          git commit -m "ci: warriortale build log [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - uses: actions/upload-artifact@v4
        with:
          name: WarriorTale-jar
          path: warriortale/build/libs/*.jar
      - name: Publish release jar
        if: success()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls warriortale/build/libs/warriortale-*.jar | grep -v sources | head -1)
          gh release create warriortale-latest --title "WarriorTale (latest build)" \
            --notes "Auto-built from the newest warriortale/ commit. Needs Fabric Loader 0.20.1+ and Fabric API 0.167.0+26.3 for Minecraft 26.3." \
            2>/dev/null || true
          gh release upload warriortale-latest "$JAR" --clobber
