name: Build WarriorTale
on:
  push:
    paths: ['warriortale/**', '.github/workflows/build-warriortale.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warriortale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe Mojang manifest
        shell: bash
        run: |
          curl -sS https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o /tmp/vm.json
          python3 - << 'PY' | tee /tmp/probe.log
          import json
          d = json.load(open('/tmp/vm.json'))
          print('LATEST:', d['latest'])
          for v in d['versions'][:12]:
              print(v['id'], v['type'])
          import urllib.request
          for v in d['versions']:
              if v['id'] in ('26.3','26.3.1','26.3.2'):
                  j = json.load(urllib.request.urlopen(v['url']))
                  print(v['id'], 'downloads:', sorted(j['downloads'].keys()))
          PY
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee /tmp/build.log
      - name: Publish build log on failure
        if: failure()
        shell: bash
        working-directory: .
        run: |
          git config user.name "ci-log"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p ci-logs
          cat /tmp/probe.log /tmp/build.log 2>/dev/null | tail -n 400 > ci-logs/warriortale-build.log
          date >> ci-logs/warriortale-build.log
          git add ci-logs
          git commit -m "ci: warriortale build log [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - uses: actions/upload-artifact@v4
        with:
          name: WarriorTale-jar
          path: warriortale/build/libs/*.jar
