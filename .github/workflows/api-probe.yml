name: api-probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/api-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon -q
      - name: Look for the sulfur cube in the Paper API
        run: |
          J=$(find ~/.gradle -name 'paper-api-26.3*.jar' ! -name '*sources*' | head -1)
          echo "jar: $J"
          unzip -l "$J" | grep -i -E 'sulf|sulph' | awk '{print $4}' > /tmp/cls.txt || true
          cat /tmp/cls.txt
          echo "::notice title=classes::$(tr '\n' ' ' < /tmp/cls.txt)"
          mkdir x && cd x && unzip -q "$J"
          for c in $(grep '\.class$' /tmp/cls.txt | grep -v '\$'); do
            out=$(javap -cp . "${c%.class}" | tr '\n' ' ' | tr -s ' ')
            echo "$out"
            echo "::notice title=${c}::${out:0:3900}"
          done
          e=$(javap -cp . -constants org.bukkit.entity.EntityType | grep -i -E 'sulf|sulph' | tr '\n' ' ')
          echo "::notice title=EntityType::$e"
