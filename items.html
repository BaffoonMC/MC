/* Layout: a codex shelf. Items sit in Minecraft-style slots, grouped by where they come from; picking one opens its in-game tooltip and how to get it. */
:root {
  --sky: #0d1218; --card: #151d26; --card-2: #1b2532; --line: #253140;
  --ink: #eef3f8; --text: #dbe3ec; --muted: #95a3b2;
  --red: #ff4b3e; --gold: #f2c04a; --deep: #2d6690;
  --slot: #8b8b8b; --slot-hi: #ffffff; --slot-lo: #373737;
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: "Pixelify", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { scroll-behavior: smooth }
body { margin: 0; background: var(--sky); color: var(--text); font: 16px/1.55 var(--body) }
a { color: inherit }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
button { font: inherit; color: inherit; cursor: pointer }

.sitebar { display: flex; align-items: center; gap: 18px; padding-block: 16px; border-bottom: 1px solid var(--line) }
.sb-brand { font: 700 26px/1 var(--display); color: var(--ink); text-decoration: none }
.sb-brand span { color: var(--red) }
.sb-links { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap }
.sb-links a { text-decoration: none; font-weight: 800; font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card) }
.sb-links a:hover { color: var(--ink) }
.sb-links a[aria-current] { color: var(--sky); background: var(--gold); border-color: var(--gold) }

header.head { padding-block: 40px 18px; display: grid; gap: 10px }
.eyebrow { font: 800 13px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--red) }
h1 { font: 700 clamp(40px, 7vw, 64px)/1 var(--display); color: var(--ink); margin: 0; text-wrap: balance }
.lede { color: var(--muted); max-width: 62ch; margin: 0 }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-block: 8px 4px }
.search { flex: 1 1 260px; min-width: 0; background: var(--card); border: 2px solid var(--line); border-radius: 999px; color: var(--text); padding: 10px 16px; font: 16px var(--body) }
.search:focus { border-color: #4f86b0; outline: none }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 2px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 7px 12px; font-weight: 800; font-size: 13.5px; white-space: nowrap }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: #2b2412 }
.count { font-size: 13.5px; color: var(--muted) }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; padding-block: 18px 64px }
.shelf { display: grid; gap: 26px; min-width: 0 }
.group h2 { font: 700 24px/1.1 var(--display); color: var(--ink); margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline }
.group h2 small { font: 700 13px var(--body); color: var(--muted) }
.group p { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; max-width: 70ch }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px }
.slotbtn { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border: 0; padding: 0; background: var(--slot); box-shadow: inset 3px 3px 0 var(--slot-lo), inset -3px -3px 0 var(--slot-hi); display: grid; place-items: center }
.slotbtn img { width: 74%; height: auto; image-rendering: auto; pointer-events: none }
.slotbtn img.px { image-rendering: pixelated }
.slotbtn:hover { background: #a3a3a3 }
.slotbtn[aria-current="true"] { background: #c6c6c6; outline: 3px solid var(--gold); outline-offset: 0 }
.slotbtn .nm { position: absolute; inset: auto 0 -20px; font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none }
.empty { color: var(--muted); padding: 30px 0 }

/* the detail panel */
.detail { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 16px; box-shadow: 0 18px 44px -24px rgba(0,0,0,.7) }
.stage { display: grid; place-items: center; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 16px; background: radial-gradient(closest-side, #263445, var(--card-2)) }
.stage img { width: 46%; height: auto; filter: drop-shadow(0 12px 10px rgba(0,0,0,.5)) }
.stage img.px { image-rendering: pixelated }
/* the in-game tooltip, as Minecraft draws it */
.tip { background: rgba(16, 0, 16, .94); border: 2px solid #100010; box-shadow: inset 0 0 0 2px #2d0a6e; padding: 10px 12px; font: 15px/1.45 var(--mono); letter-spacing: .01em; overflow-wrap: anywhere }
.tip .tn { font-size: 18px; margin-bottom: 4px }
.tip .tl { font-size: 15px; min-height: 1em }
.tip .tl.i { font-style: italic }
.facts { display: grid; gap: 0; margin: 0 }
.fact { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding-block: 9px; border-top: 1px solid var(--line) }
.fact dt { font: 800 12px/1.6 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.fact dd { margin: 0; font-size: 15px }
.fact dd ul { margin: 0; padding-left: 18px }
.how { color: var(--ink) }
.pill { display: inline-block; font: 800 12px/1 var(--body); padding: 6px 10px; border-radius: 999px; background: #2b2412; color: var(--gold); margin-right: 6px }
.close { display: none }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr) }
  .detail { position: fixed; inset: auto 0 0 0; top: auto; max-height: 82vh; overflow-y: auto; border-radius: 22px 22px 0 0; z-index: 40; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)) }
  .close { display: inline-flex; justify-self: end; background: var(--card-2); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 800 }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 39 }
}
@media (min-width: 961px) { .scrim { display: none } }
@media (max-width: 520px) { .slots { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)) } .sb-links a { padding: 7px 10px; font-size: 13px } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto } }

const GROUPS = [
  { key: "moloch", name: "Moloch", blurb: "Taken from the furnace god, his realm and his cult." },
  { key: "heaven", name: "Heaven and God", blurb: "Gifts of the old man and the Seven Heavens." },
  { key: "quantum", name: "Quantum", blurb: "Built from a Quantum Core, an Ember of Moloch and a Tear of God." },
  { key: "abduction", name: "Abduction", blurb: "The kidnapper's kit, mostly sold by the Blood Priest." },
  { key: "priest", name: "Blood Priest's Table", blurb: "Food and worse, for the faithful and the inhuman." },
  { key: "potions", name: "Potions", blurb: "Brewed from tumours and Cloud Cotton." },
  { key: "wearables", name: "Wearables", blurb: "Hats and outfits. Some do something, some just look good." },
  { key: "parasites", name: "Parasites", blurb: "Things that live on you." },
  { key: "relics", name: "Relics and guides", blurb: "One of a kind." }
];
const GROUP_OF = id =>
  /^quantum_|^ember_of_moloch$|^tear_of_god$/.test(id) ? "quantum" :
  /^(hood|cudgel|shackles|thief_key)$/.test(id) ? "abduction" :
  /^(beef_tartare|festering_flesh|heart_of_darkness)$/.test(id) ? "priest" :
  /potion/.test(id) ? "potions" :
  /^(ancient_|halo$|heavenly_respirator$|angel_engine$|cloud_cotton)/.test(id) ? "heaven" :
  /^(moloch_|horns$|skull_of_mictlan$|viking_helm$|spiked_cultist_axe$|blood_emerald$|tumour)/.test(id) ? "moloch" :
  /^(black_filament|cortex_leech)$/.test(id) ? "parasites" :
  /^(blade_of_potential|bestiary)$/.test(id) ? "relics" : "wearables";
const PIXEL = new Set(ITEMS.filter(i => !i.three).map(i => i.id));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let filter = "all", query = "", current = null;

function chips() {
  const counts = {}; ITEMS.forEach(i => counts[GROUP_OF(i.id)] = (counts[GROUP_OF(i.id)] || 0) + 1);
  $("#chips").innerHTML = [`<button class="chip" data-g="all" aria-pressed="${filter === "all"}">All ${ITEMS.length}</button>`]
    .concat(GROUPS.filter(g => counts[g.key]).map(g => `<button class="chip" data-g="${g.key}" aria-pressed="${filter === g.key}">${esc(g.name)} ${counts[g.key]}</button>`)).join("");
}
function matches(i) {
  if (filter !== "all" && GROUP_OF(i.id) !== filter) return false;
  if (!query) return true;
  const hay = (i.name + " " + (i.lore || []).map(l => l.text).join(" ") + " " + (HOW[i.id] || "")).toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}
function shelf() {
  const shown = ITEMS.filter(matches);
  $("#count").textContent = shown.length === ITEMS.length ? `${ITEMS.length} items` : `${shown.length} of ${ITEMS.length} items`;
  const html = GROUPS.map(g => {
    const list = shown.filter(i => GROUP_OF(i.id) === g.key);
    if (!list.length) return "";
    return `<section class="group" id="g-${g.key}"><h2>${esc(g.name)} <small>${list.length}</small></h2><p>${esc(g.blurb)}</p><div class="slots">` +
      list.map(i => `<button class="slotbtn" data-id="${i.id}" aria-current="${current === i.id}" title="${esc(i.name)}" aria-label="${esc(i.name)}"><img class="${PIXEL.has(i.id) ? "px" : ""}" alt="" src="${ICONS[i.id]}"></button>`).join("") + `</div></section>`;
  }).join("");
  $("#shelf").innerHTML = html || `<p class="empty">No items match. Try another word or pick All.</p>`;
}
const ATTR = { armor: "Armor", armor_toughness: "Armor Toughness", knockback_resistance: "Knockback Resistance", attack_damage: "Attack Damage", attack_speed: "Attack Speed",
  movement_speed: "Speed", max_health: "Max Health", scale: "Size", block_interaction_range: "Reach", entity_interaction_range: "Reach", mining_efficiency: "Mining Speed", gravity: "Gravity", safe_fall_distance: "Safe Fall" };
function attr(s) {
  const [k, op, v] = s.split(" "), n = Number(v), name = ATTR[k] || k.replace(/_/g, " ");
  if (op === "ADD_NUMBER") {
    if (k === "knockback_resistance") return `${n > 0 ? "+" : ""}${Math.round(n * 100)}% ${name}`;
    if (k === "max_health") return `${n > 0 ? "+" : ""}${n / 2} hearts`;
    return `${n > 0 ? "+" : ""}${+n.toFixed(2)} ${name}`;
  }
  return `${n > 0 ? "+" : ""}${Math.round(n * 100)}% ${name}`;
}
const SLOT = { HEAD: "Head", CHEST: "Chest", LEGS: "Legs", FEET: "Feet", HAND: "Main hand", OFF_HAND: "Off hand" };
function show(id, push) {
  const i = ITEMS.find(x => x.id === id); if (!i) return;
  current = id;
  document.querySelectorAll(".slotbtn").forEach(b => b.setAttribute("aria-current", b.dataset.id === id));
  $("#dImg").src = ICONS[id]; $("#dImg").className = PIXEL.has(id) ? "px" : ""; $("#dImg").alt = i.name;
  $("#dTip").innerHTML = `<div class="tn" style="color:${i.color || "#ffffff"}">${esc(i.name)}</div>` +
    (i.lore || []).map(l => `<div class="tl${l.italic ? " i" : ""}" style="color:${l.color || "#aa00aa"}">${esc(l.text) || "&nbsp;"}</div>`).join("");
  const facts = [];
  facts.push(["How to get", `<span class="how">${esc(HOW[id] || "Ask staff.")}</span>`]);
  if (i.slot) facts.push(["Worn on", SLOT[i.slot] || i.slot]);
  if (i.attributes && i.attributes.length) facts.push(["Stats", `<ul>${i.attributes.map(a => `<li>${esc(attr(a))}</li>`).join("")}</ul>`]);
  facts.push(["Stacks to", String(i.maxStack || 64)]);
  facts.push(["Group", esc(GROUPS.find(g => g.key === GROUP_OF(id)).name)]);
  $("#dFacts").innerHTML = facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) {} }
  if (matchMedia("(max-width: 960px)").matches && push) { $("#detail").hidden = false; $("#scrim").hidden = false; }
}
function closeSheet() { if (matchMedia("(max-width: 960px)").matches) { $("#detail").hidden = true; $("#scrim").hidden = true; } }
document.addEventListener("click", e => {
  const s = e.target.closest(".slotbtn"), c = e.target.closest(".chip");
  if (s) show(s.dataset.id, true);
  if (c) { filter = c.dataset.g; chips(); shelf(); }
});
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); shelf(); });
$("#close").onclick = $("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h) show(h, false); });
chips(); shelf();
const start = location.hash.slice(1);
show(ITEMS.some(i => i.id === start) ? start : "sinners_halo", false);
if (matchMedia("(max-width: 960px)").matches) { $("#detail").hidden = !ITEMS.some(i => i.id === start); $("#scrim").hidden = $("#detail").hidden; }
</script>
